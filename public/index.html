<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL Query Workbench</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1220;color:#e8eef8}*{box-sizing:border-box}body{max-width:1050px;margin:auto;padding:32px}h1{font-size:clamp(2rem,5vw,3.2rem)}p{color:#aab9cc;line-height:1.6}.panel{background:#121e32;border:1px solid #293b59;border-radius:16px;padding:18px;margin:16px 0}input{width:100%;background:#07101e;color:#e2e8f0;border:1px solid #405574;border-radius:9px;padding:12px;font:14px ui-monospace,monospace}button{background:#2563eb;color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.muted{background:#334155}.row{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;margin:9px 0}.out{overflow-wrap:anywhere;background:#07101e;padding:14px;border-radius:10px;color:#a5f3fc}@media(max-width:650px){.row{grid-template-columns:1fr}.row button{justify-self:start}}</style></head><body><p>URL ENGINEERING · LOCAL WORKBENCH</p><h1>URL Query Workbench</h1><p>Edit query parameters without losing repeated keys or empty values.</p><section class="panel"><h2>Source URL</h2><input id="url" value="https://example.com/search?q=hello%20world&tag=one&tag=two&empty="><div style="margin-top:12px"><button id="parse">Parse URL</button></div></section><section class="panel"><h2>Query parameters</h2><div id="rows"></div><button id="add" class="muted">＋ Add parameter</button><button id="build">Build URL</button></section><section class="panel"><h2>Result</h2><div id="result" class="out">Parse a URL to begin.</div><button id="copy" class="muted" style="margin-top:12px">Copy result</button><p id="status"></p></section><script>const $=s=>document.querySelector(s);let base=null;function addRow(key="",value=""){const row=document.createElement("div");row.className="row";const k=document.createElement("input"),v=document.createElement("input"),del=document.createElement("button");k.placeholder="Key";v.placeholder="Value";k.value=key;v.value=value;del.textContent="Remove";del.className="muted";del.onclick=()=>row.remove();row.append(k,v,del);$("#rows").append(row)}function parse(){try{base=new URL($("#url").value);$("#rows").innerHTML="";for(const [k,v] of base.searchParams.entries())addRow(k,v);if(!base.searchParams.size)addRow();$("#status").textContent="Parsed. Repeated keys are kept as separate rows."}catch(e){$("#status").textContent="Invalid URL: "+e.message}}function build(){if(!base){parse();if(!base)return}const u=new URL(base.href);u.search="";document.querySelectorAll("#rows .row").forEach(r=>{const [k,v]=r.querySelectorAll("input");if(k.value!=="")u.searchParams.append(k.value,v.value)});$("#result").textContent=u.href;$("#status").textContent="Built with URLSearchParams; repeated keys remain repeated."}$("#parse").onclick=parse;$("#add").onclick=()=>addRow();$("#build").onclick=build;$("#copy").onclick=async()=>{try{await navigator.clipboard.writeText($("#result").textContent);$("#status").textContent="Copied."}catch{$("#status").textContent="Clipboard unavailable in this context; select the result to copy."}};parse();</script></body></html>
